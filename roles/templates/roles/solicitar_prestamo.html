{% extends 'base.html' %}
{% block content %}
<div class="content-container">
  <h4>➕ Solicitar préstamo</h4>

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Cliente prestamista</label>
      <select name="prestamista_id" class="form-select" required>
        <option value="">— Elegir —</option>
        {% for c in candidatos %}
          <option value="{{ c.cliente.id }}" data-gestor="{{ c.gestor.id }}">
            {{ c.cliente.username }} (gestor: {{ c.gestor.username }})
          </option>
        {% endfor %}
      </select>
    </div>

    <input type="hidden" name="gestor_id" id="gestor_id">

    <div class="mb-3">
      <label class="form-label">Forma de pago</label>
      <select name="forma_pago_id" class="form-select" required>
        {% for fp in candidatos.0.formas_pago %}
          <option value="{{ fp.id }}">{{ fp.nombre }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Monto</label>
      <input type="number" name="monto" step="0.01" min="0.01" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Motivo (opcional)</label>
      <textarea name="motivo" class="form-control" rows="2"></textarea>
    </div>

    <button class="btn btn-primary">Enviar solicitud</button>
    <a href="{% url 'roles:mis_prestamos' %}" class="btn btn-secondary">Cancelar</a>
  </form>

  <script>
    document.querySelector('select[name="prestamista_id"]').addEventListener('change', function(){
      var opt = this.options[this.selectedIndex];
      document.getElementById('gestor_id').value = opt.dataset.gestor || '';
    });
  </script>
</div>
{% endblock %}
