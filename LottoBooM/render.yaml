databases:
  - name: lottoboom-db
    databaseName: lottoboom
    plan: free
    region: ohio

services:
  - type: web
    name: lottoboom
    runtime: python
    plan: free
    region: ohio
    branch: main
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn LottoBooM.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: lottoboom-db
          property: connectionString
