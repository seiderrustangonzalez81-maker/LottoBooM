name: Scrape Loterias

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '1 5 * * *'
    - cron: '1 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scraper.py'
      - '.github/workflows/scrape.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install beautifulsoup4 playwright requests tzdata
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # 1. Guardar el archivo generado por el scraper en un lugar seguro
          cp resultados.json /tmp/resultados_nuevos.json
          
          # 2. Traer el último estado de GitHub de forma forzada
          git fetch origin main
          git reset --hard origin/main
          
          # 3. Sobrescribir el archivo con la versión que generó el scraper
          cp /tmp/resultados_nuevos.json resultados.json
          
          # 4. Subir sin conflictos
          git add resultados.json
          git diff --staged --quiet || git commit -m "Update resultados [skip ci]"
          git push origin main

      - name: Re-enable workflow if disabled
        if: always()
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/scrape.yml/enable" \
            || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
