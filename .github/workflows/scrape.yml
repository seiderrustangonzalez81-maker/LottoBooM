name: Scrape Loterias
on:
  push:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright lxml
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push if changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          touch resultados.json debug_conectate.html
          git add resultados.json debug_conectate.html
          git diff --staged --quiet || git commit -m "Actualizar resultados [skip ci]"
          git push
