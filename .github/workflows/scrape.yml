name: Scrape Loterias

on:
  schedule:
    # ── Runs normales cada 15 min ──
    - cron: '*/15 * * * *'

    # ── Runs extra de la ventana crítica nocturna ──
    # (23:30 a 00:10 Havana ≈ 03:30-05:10 UTC según DST)
    # Estos ya están cubiertos por */15, pero los dejamos explícitos
    # por si en el futuro se reduce la frecuencia general.

    # ── Disparo exacto de la limpieza a las 00:01 Havana ──
    # Havana sin DST: 00:01 Havana = 05:01 UTC
    - cron: '1 5 * * *'
    # Havana con DST:  00:01 Havana = 04:01 UTC
    - cron: '1 4 * * *'

  workflow_dispatch:
  push:
    paths:
      - 'scraper.py'
      - '.github/workflows/scrape.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install beautifulsoup4 playwright requests
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add resultados.json
          git diff --staged --quiet || git commit -m "Update resultados [skip ci]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git pull --rebase origin main || true
          git push origin main

      - name: Re-enable workflow if disabled
        if: always()
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/scrape.yml/enable" \
            || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
