name: Scrape Loterias

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-loterias
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.65.2-chromium-v1

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 requests "playwright==1.65.2" "tzdata>=2026.6"
          python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          PYTHONTZPATH: ""
        run: python scraper.py

      - name: Commit and push resultados.json
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add resultados.json
          if git diff --cached --quiet; then
            echo "No hay cambios en resultados.json."
            exit 0
          fi
          git commit -m "Update resultados"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
