name: Scrape Loterias

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi tzdata requests

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          cp resultados.json /tmp/resultados_nuevos.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/resultados_nuevos.json resultados.json
          git add resultados.json
          git diff --staged --quiet || git commit -m "Update resultados [skip ci]"
          git push origin main
