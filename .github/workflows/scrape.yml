name: Scrape Loterias

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-loterias
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 playwright tzdata
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push resultados.json
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add resultados.json

          if git diff --cached --quiet; then
            echo "No hay cambios en resultados.json."
            exit 0
          fi

          git commit -m "Update resultados [skip ci]"
          git push origin HEAD:main
