
name: Scrape Loterias

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-loterias-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 requests playwright tzdata
          python -m playwright install --with-deps chromium

      - name: Validate scraper startup
        run: |
          python -m py_compile scraper.py
          python scripts/check_scraper_startup.py

      - name: Run scraper
        run: python scraper.py

      - name: Validate resultados.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("resultados.json")

          if not path.exists():
              raise SystemExit("ERROR: resultados.json no existe")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list) or not data:
              raise SystemExit("ERROR: JSON vacío o estructura incorrecta")

          valid = [
              item for item in data
              if isinstance(item, dict)
              and item.get("sorteo_nombre")
              and item.get("fecha")
          ]

          if not valid:
              raise SystemExit("ERROR: no hay resultados válidos")

          print(f"JSON validado: {len(valid)} registros.")
          PY

      - name: Commit and push resultados.json
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git add resultados.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No hay cambios nuevos."
            exit 0
          fi

          git commit -m "Update resultados"

          git pull --rebase origin main

          git push origin HEAD:main

          COMMIT_PUBLICADO="$(git rev-parse HEAD)"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT_PUBLICADO" >> "$GITHUB_OUTPUT"

          echo "Publicado correctamente: $COMMIT_PUBLICADO"

      - name: Notify Django immediately
        if: steps.publish.outputs.changed == 'true'
        env:
          IMPORT_WEBHOOK_URL: ${{ secrets.IMPORT_WEBHOOK_URL }}
          IMPORT_WEBHOOK_SECRET: ${{ secrets.IMPORT_WEBHOOK_SECRET }}
          COMMIT_PUBLICADO: ${{ steps.publish.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$IMPORT_WEBHOOK_URL" ] || [ -z "$IMPORT_WEBHOOK_SECRET" ]; then
            echo "::error::Faltan los secretos de notificación."
            exit 1
          fi

          PAYLOAD="$(jq -cn \
            --arg event "results_published" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "main" \
            --arg commit "$COMMIT_PUBLICADO" \
            '{
              event: $event,
              repository: $repository,
              branch: $branch,
              commit: $commit
            }')"

          SIGNATURE="$(
            printf '%s' "$PAYLOAD" |
            openssl dgst -sha256 -hmac "$IMPORT_WEBHOOK_SECRET" |
            awk '{print $2}'
          )"

          echo "Notificando a Django..."

          if ! HTTP_CODE="$(curl \
            --silent \
            --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-LottoBooM-Signature: sha256=$SIGNATURE" \
            --data "$PAYLOAD" \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$IMPORT_WEBHOOK_URL")"; then

            cat response.json || true
            echo "::error::Falló la comunicación con Django."
            exit 1
          fi

          cat response.json

          if [[ ! "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Respuesta HTTP no válida: $HTTP_CODE"
            exit 1
          fi

          echo "Django aceptó la notificación: HTTP $HTTP_CODE"
