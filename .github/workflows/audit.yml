name: Auditoría del repositorio
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ejecutar auditoría estática de alineación
        run: python scripts/auditar_sorteos.py --json audit-report.json
      - name: Instalar dependencias Django para smoke audit
        run: pip install -r requirements.txt
      - name: Smoke audit dinámico Django (sin DB de producción)
        env:
          DEBUG: "true"
          SECRET_KEY: "ci-only-not-a-production-secret"
        run: python scripts/auditar_django_runtime.py
      - name: Pruebas del parser de apuestas (Node.js)
        run: node --test scripts/tests/test_apostar_text_validator.js
      - name: Pruebas unitarias de auditoría
        env:
          DEBUG: "true"
          SECRET_KEY: "ci-only-not-a-production-secret"
        run: python -m unittest discover -s scripts/tests -v
      - name: Publicar reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          if-no-files-found: warn
          retention-days: 14
