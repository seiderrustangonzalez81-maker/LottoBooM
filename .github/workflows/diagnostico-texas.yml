name: Diagnostico Texas Daily 4

on:
  push:
    branches:
      - diagnostico-texas-daily4
    paths:
      - diagnostico_texas_daily4.py
      - .github/workflows/diagnostico-texas.yml

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Inspeccionar tarjetas Texas Daily 4
        run: python diagnostico_texas_daily4.py
