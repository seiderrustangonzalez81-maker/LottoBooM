{% extends "base.html" %}
{% load static %}

{% block page_title %}Superparlet • Futuro{% endblock %}
{% block page_subtitle %}Apuesta combinada con estilo visionario{% endblock %}

{% block extra_css %}
<style>
    /* ═══════════════════════════════════════════════════════════════
       SUPERPARSER_REDISENO_V1 — Paleta clara multicolor
       ═══════════════════════════════════════════════════════════════ */
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #eef4ff 0%, #dbeafe 50%, #e0e7ff 100%);
      color: #1e293b;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      overflow-x: hidden;
    }
    .container-fluid { position: relative; z-index: 1; }

    /* ═══ TARJETAS BASE ═══ */
    .sp-card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 20px;
      box-shadow: 4px 4px 0 rgba(148, 163, 184, .25);
      overflow: hidden;
      transition: all 0.2s;
      margin-bottom: 1rem;
    }
    .sp-card:hover {
      box-shadow: 6px 6px 0 rgba(148, 163, 184, .35);
      transform: translate(-1px, -1px);
    }
    .sp-card .sp-card-header {
      padding: 1rem 1.3rem;
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 0.3px;
      font-size: 1.05rem;
      text-shadow: 0 1px 2px rgba(0,0,0,.15);
    }
    .sp-card .sp-card-header i { margin-right: 10px; }
    .sp-card .sp-card-body { padding: 1.2rem 1.3rem; }

    /* ═══ CAPA 1: CLIENTE (lila) ═══ */
    .sp-card.card-cliente {
      background: linear-gradient(145deg, #faf5ff, #f3e8ff);
      border-color: #d8b4fe;
    }
    .sp-card.card-cliente .sp-card-header {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      border-bottom: 2px solid #5b21b6;
    }
    .sp-card.card-cliente .sp-card-header i { color: #fde047; }

    /* ═══ CAPA 2: PARLETS (azul cielo) ═══ */
    .sp-card.card-parlets {
      background: linear-gradient(145deg, #f0f9ff, #e0f2fe);
      border-color: #93c5fd;
    }
    .sp-card.card-parlets .sp-card-header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-bottom: 2px solid #1e40af;
    }
    .sp-card.card-parlets .sp-card-header i { color: #fde047; }

    /* ═══ CAPA 3: RESUMEN (menta) ═══ */
    .sp-card.card-resumen {
      background: linear-gradient(145deg, #f0fdf4, #d1fae5);
      border-color: #6ee7b7;
    }
    .sp-card.card-resumen .sp-card-header {
      background: linear-gradient(135deg, #10b981, #047857);
      border-bottom: 2px solid #065f46;
    }
    .sp-card.card-resumen .sp-card-header i { color: #fde047; }

    /* ═══ SELECTORES ═══ */
    .selector-cliente {
      background: #ffffff;
      border: 2px solid #d8b4fe;
      border-radius: 14px;
      padding: 0.8rem 1rem;
      margin-bottom: 0.5rem;
    }
    .form-select, .form-control, .form-control-sm {
      background: #ffffff !important;
      border: 1.5px solid #cbd5e1 !important;
      color: #1e293b !important;
      border-radius: 10px !important;
      padding: 0.55rem 0.9rem !important;
      font-weight: 600;
      transition: all 0.2s;
    }
    .form-select:focus, .form-control:focus {
      border-color: #8b5cf6 !important;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, .20) !important;
      background: #ffffff !important;
    }
    .form-select option { background: #ffffff; color: #1e293b; }
    .form-label {
      color: #6d28d9;
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }
    .ap-label-note {
      font-weight: 500 !important;
      color: #64748b;
      font-size: 0.7rem !important;
      text-transform: none !important;
      letter-spacing: 0 !important;
    }

    /* ═══ BOTONES ═══ */
    .btn-sp {
      border-radius: 60px;
      padding: 0.6rem 1.8rem;
      font-weight: 800;
      font-size: 0.9rem;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      letter-spacing: 0.3px;
      cursor: pointer;
    }
    .btn-sp:hover { transform: translate(-1px,-1px); }
    .btn-sp:active { transform: translate(1px,1px); }
    .btn-sp-gold {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      box-shadow: 3px 3px 0 #92400e;
    }
    .btn-sp-gold:hover { box-shadow: 4px 4px 0 #92400e; }
    .btn-sp-success {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      box-shadow: 3px 3px 0 #1e3a8a;
    }
    .btn-sp-success:hover { box-shadow: 4px 4px 0 #1e3a8a; }
    .btn-sp-outline {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      color: #475569;
    }
    .btn-sp-outline:hover { border-color: #8b5cf6; color: #6d28d9; background: #faf5ff; }

    /* ═══ PARLETS (FILA) ═══ */
    .superparlet-fila {
      background: #ffffff;
      border-radius: 14px;
      padding: 0.8rem 1rem;
      border: 2px solid #bfdbfe;
      transition: border 0.2s;
      margin-bottom: 0.6rem;
    }
    .superparlet-fila:hover { border-color: #3b82f6; }
    .superparlet-parlet {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      color: #1e3a8a;
    }
    .total-fila {
      font-weight: 800;
      color: #047857;
      background: #d1fae5;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      display: inline-block;
      min-width: 70px;
      text-align: center;
      font-size: 1rem;
      border: 1.5px solid #6ee7b7;
    }

    /* ═══ MOSAICO RESUMEN ═══ */
    .mosaico-resumen {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 0.5rem;
    }
    .mosaico-resumen .celda {
      background: #ffffff;
      border-radius: 14px;
      padding: 0.7rem 0.8rem;
      border: 2px solid #a7f3d0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 65px;
      transition: all 0.2s;
    }
    .mosaico-resumen .celda:hover { border-color: #34d399; }
    .mosaico-resumen .celda .etiqueta {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #64748b;
      margin-bottom: 3px;
      font-weight: 700;
    }
    .mosaico-resumen .celda .valor {
      font-weight: 800;
      font-size: 1.05rem;
      color: #1e293b;
      word-break: break-word;
    }
    .mosaico-resumen .celda .valor.success { color: #047857; }
    .mosaico-resumen .celda .valor.danger { color: #b91c1c; }
    .mosaico-resumen .celda .valor.warning { color: #b45309; }
    .mosaico-resumen .celda .valor.primary { color: #6d28d9; }
    .mosaico-resumen .celda.span-2 { grid-column: span 2; }

    .mosaico-resumen .celda-sorteos,
    .mosaico-resumen .celda-parlets {
      grid-column: 1 / -1;
      background: #ffffff;
      border-color: #a7f3d0;
    }
    .mosaico-resumen .celda-sorteos .item-sorteo,
    .mosaico-resumen .celda-parlets .item-jugada {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #f0fdf4;
      border-radius: 8px;
      padding: 0.25rem 0.6rem;
      margin-bottom: 0.2rem;
      font-size: 0.75rem;
      border: 1px solid #bbf7d0;
    }
    .mosaico-resumen .celda-sorteos .item-sorteo .tipo,
    .mosaico-resumen .celda-parlets .item-jugada .tipo {
      color: #6d28d9;
      font-weight: 800;
      min-width: 60px;
    }
    .mosaico-resumen .celda-sorteos .item-sorteo .nombre,
    .mosaico-resumen .celda-parlets .item-jugada .nums {
      flex: 1;
      color: #334155;
      font-weight: 600;
    }
    .mosaico-resumen .celda-sorteos .item-sorteo .hora {
      font-weight: 800;
      color: #b45309;
    }
    .mosaico-resumen .celda-parlets .item-jugada .mto {
      font-weight: 800;
      color: #047857;
    }

    #avisoDescuentoExtra {
      grid-column: 1 / -1;
      padding: 0.6rem 1rem;
      border-radius: 12px;
      min-height: auto;
      background: #fef3c7;
      border: 2px solid #fcd34d;
      color: #92400e;
      font-weight: 700;
      font-size: 0.8rem;
      flex-direction: row !important;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* ═══ MODAL SORTEOS ═══ */
    .modal-sorteos-overlay {
      position: fixed;
      top:0;left:0;width:100%;height:100%;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 1rem;
    }
    .modal-sorteos-overlay.active { display: flex; }
    .modal-sorteos-box {
      background: #ffffff;
      border: 2px solid #93c5fd;
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 1.3rem;
      box-shadow: 0 20px 60px rgba(30, 64, 175, 0.3);
    }
    .modal-sorteos-box .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #dbeafe;
      padding-bottom: 12px;
      margin-bottom: 16px;
      color: #1e3a8a;
      font-weight: 800;
    }
    .modal-sorteos-box .modal-footer {
      border-top: 2px solid #dbeafe;
      padding-top: 14px;
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .modal-sorteos-box .sorteo-check {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 0.7rem 0.9rem;
      border: 2px solid #dbeafe;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      background: #f8fafc;
      color: #1e293b;
      margin-bottom: 8px;
    }
    .modal-sorteos-box .sorteo-check:hover {
      background: #eff6ff;
      border-color: #60a5fa;
    }
    .modal-sorteos-box .sorteo-check input[type="checkbox"] {
      accent-color: #2563eb;
      width: 18px;
      height: 18px;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .modal-sorteos-box .sorteo-check strong {
      color: #1e3a8a !important;
      font-size: 1rem;
      font-weight: 800;
    }
    .modal-sorteos-box .sorteo-check small {
      color: #475569 !important;
      font-size: 0.8rem;
      display: block;
      margin-top: 2px;
    }
    .modal-sorteos-box .sorteo-check small i { color: #94a3b8; margin-right: 4px; }
    .modal-sorteos-box .sorteo-check .badge-minutos {
      background: #fef3c7 !important;
      color: #92400e !important;
      font-weight: 800;
      padding: 0.2rem 0.7rem;
      border-radius: 60px;
      font-size: 0.7rem;
      border: 1.5px solid #fcd34d;
      display: inline-block;
      margin-top: 4px;
    }
    .modal-sorteos-box .sorteo-check .info-text {
      display: flex;
      flex-direction: column;
    }

    /* ═══ TABLA DE FORMAS DE PAGO ═══ */
    #tablaFondos { color: #1e293b; }
    #tablaFondos td.forma-pago-nombre,
    #tablaFondos th.forma-pago-nombre {
      color: #1e293b !important;
      font-weight: 800 !important;
      background: #f1f5f9 !important;
    }
    #tablaFondos td.total-col,
    #tablaFondos th.total-col {
      color: #1d4ed8 !important;
      font-weight: 800 !important;
    }
    #tablaFondos .table-success { background: #d1fae5 !important; }
    #tablaFondos .table-warning { background: #fef3c7 !important; }
    #tablaFondos .table-info    { background: #dbeafe !important; }

    /* ═══ REQUISITOS ═══ */
    .requisitos-msg {
      background: #fef3c7;
      border: 2px solid #fcd34d;
      border-radius: 14px;
      padding: 0.8rem 1rem;
      color: #92400e;
      font-weight: 700;
    }
    .requisitos-msg i { margin-right: 8px; }

    /* ═══ TOAST ═══ */
    #toastContainer {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      max-width: 360px;
    }

    /* ═══ FORMAS DE PAGO RADIO ═══ */
    .forma-pago-radio {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.5rem 0.8rem;
      border: 2px solid #dbeafe;
      border-radius: 12px;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.2s;
      color: #1e293b;
    }
    .forma-pago-radio:hover { border-color: #60a5fa; background: #eff6ff; }
    .forma-pago-radio input[type="radio"] { accent-color: #2563eb; }

    /* ═══ FOOTER ═══ */
    .footer-totales {
      background: #ffffff;
      border: 2px solid #bfdbfe;
      border-radius: 20px;
      padding: 1rem 1.3rem;
      margin-top: 1.5rem;
      color: #1e293b;
      box-shadow: 4px 4px 0 rgba(148, 163, 184, .25);
    }
    .btn-confirmar-footer {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: 2px solid #1e3a8a;
      border-radius: 60px;
      color: #ffffff;
      font-weight: 800;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 4px 4px 0 #1e3a8a;
      margin-top: 0.5rem;
    }
    .btn-confirmar-footer:hover:not(:disabled) {
      transform: translate(-1px,-1px);
      box-shadow: 5px 5px 0 #1e3a8a;
    }
    .btn-confirmar-footer:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 768px) {
      body { padding: 0.6rem; }
      .mosaico-resumen {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .mosaico-resumen .celda.span-2 { grid-column: span 2; }
      .sp-card .sp-card-body { padding: 1rem; }
      .sp-card .sp-card-header { font-size: 0.95rem; padding: 0.8rem 1rem; }
      .btn-sp { padding: 0.5rem 1.2rem; font-size: 0.8rem; }
    }
    @media (max-width: 480px) {
      .mosaico-resumen { grid-template-columns: 1fr; }
      .mosaico-resumen .celda.span-2 { grid-column: 1; }
      .sp-card .sp-card-body { padding: 0.8rem; }
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(148, 163, 184, 0.15); }
    ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.5); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.8); }

    input:disabled, textarea:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      background: #f1f5f9 !important;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    #parletsContainer { display: block !important; }

{% endblock %}

{% block content %}
<div id="toastContainer"></div>
<div class="container-fluid py-3">
  <div class="row g-4">
    <!-- COLUMNA IZQUIERDA: FORMULARIO -->
    <div class="col-lg-8">
      <div class="sp-card card-cliente">
        <div class="sp-card-header">
          <h5 class="mb-0 fw-bold"><i class="fas fa-star"></i> Superparlet <span style="font-weight:400;font-size:0.8rem;color:#9ca3af;">• visión futurista</span></h5>
          <span class="badge bg-success bg-opacity-25 text-success" style="padding:0.4rem 1rem;border-radius:60px;border:1px solid rgba(52,211,153,0.15);">ACTIVO</span>
        </div>
        <div class="sp-card-body">
          <form id="superparletForm" novalidate>
            {% csrf_token %}
            <input type="hidden" name="cliente_id" id="clienteIdHidden" value="">

            <!-- CLIENTE + FECHA -->
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <div class="selector-cliente">
                  <label for="clienteSelect" class="form-label">
                    <i class="fas fa-user-circle me-1"></i>{% if es_cliente %}Gestor{% else %}Cliente{% endif %}
                    <span class="ap-label-note"> — saldo total referencial</span>
                  </label>
                  <select id="clienteSelect" class="form-select">
                    <option value="">-- Seleccionar --</option>
                    {% for item in clientes %}
                      <option value="{{ item.id }}" data-nombre="{{ item.nombre }}" data-saldo="{{ item.saldo_total|floatformat:2 }}" data-bonos="{{ item.bonos_activos|floatformat:2 }}" data-telefono="{{ item.telefono|default:'' }}" data-rol="{{ item.rol|default:'' }}">
                        {{ item.nombre }} (Saldo: ${{ item.saldo_total|floatformat:2 }})
                      </option>
                    {% empty %}
                      <option value="" disabled>{% if es_cliente %}No tienes gestores con fondos activos.{% else %}No tienes clientes asignados.{% endif %}</option>
                    {% endfor %}
                  </select>
                  <input type="hidden" name="cliente_seleccionado" id="clienteSeleccionado" value="">
                  <div class="mt-2">
                    <span id="clienteSeleccionadoNombre" class="text-muted" style="font-size:0.85rem;">Ninguno seleccionado</span>
                    <button type="button" id="cancelarClienteBtn" class="btn btn-outline-danger btn-sm rounded-pill ms-2" style="display:none;">
                      <i class="fas fa-times"></i> Cancelar
                    </button>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <label for="fechaApuesta" class="form-label"><i class="fas fa-calendar me-1"></i>Fecha</label>
                <input type="date" id="fechaApuesta" name="fecha" class="form-control" value="{{ hoy|date:'Y-m-d' }}" min="{{ hoy|date:'Y-m-d' }}">
              </div>
            </div>

            <!-- FORMAS DE PAGO -->
            <div id="tablaFondosCliente" style="display:none;" class="mb-4">
              <div class="sp-card card-parlets">
                <div class="sp-card-header bg-transparent" style="border-bottom:1px solid rgba(255,255,255,0.05);">
                  <span id="fondosClienteNombre" style="color:#c4b5fd;">Cliente: -</span>
                  <span id="fondosGestorNombre" style="color:#9ca3af;">Gestor: -</span>
                </div>
                <div class="card-body p-0">
                  <div class="table-responsive">
                    <table class="table table-sm table-borderless mb-0" id="tablaFondos">
                      <thead class="bg-transparent" style="border-bottom:1px solid rgba(255,255,255,0.05);">
                        <tr>
                          <th class="forma-pago-nombre" style="color:#000 !important;font-weight:700 !important;background:#f3f4f6 !important;">Forma de Pago</th>
                          <th>Saldo</th>
                          {% if es_superadmin %}<th>Bonos</th>{% endif %}
                          <th class="total-col" style="color:#2563eb !important;font-weight:700 !important;">Total</th>
                          <th>Seleccionar</th>
                        </tr>
                      </thead>
                      <tbody id="cuerpoTablaFondos">
                        <tr><td colspan="{% if es_superadmin %}5{% else %}4{% endif %}" class="text-center text-muted">Selecciona un cliente</td></tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>

            <!-- SORTEOS -->
            <div class="row g-2 mb-4">
              <div class="col-12">
                <label class="form-label"><i class="fas fa-calendar-alt me-1"></i>Sorteos (elige 2)</label>
                <div class="d-flex align-items-center gap-3 flex-wrap">
                  <button type="button" class="btn btn-sp btn-sp-outline" id="btnAbrirSorteosSuperparlet">
                    <i class="fas fa-edit"></i> Seleccionar
                  </button>
                  <span id="sorteosSeleccionadosCount" class="badge bg-primary bg-opacity-20 text-primary" style="padding:0.4rem 1rem;border-radius:60px;">0 seleccionados</span>
                </div>
                <div id="sorteosSeleccionadosList" class="mt-2 small text-muted">Ningún sorteo seleccionado</div>
                <input type="hidden" name="superparlet_sorteos" id="sorteosHiddenInput" value="">
              </div>
            </div>

            <!-- PARLETS -->
            <div id="parletsContainer">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="form-label"><i class="fas fa-table me-1"></i>Parlets (jugadas)</label>
                <span class="badge bg-info bg-opacity-20 text-info" style="padding:0.3rem 1rem;border-radius:60px;">Escribe libremente</span>
              </div>
              <div id="parletsHelper" class="parlets-helper">
                <i class="fas fa-info-circle"></i> Completa cliente, forma de pago y 2 sorteos para habilitar la escritura.
              </div>
              <div id="superparletLista">
                <div class="superparlet-fila mb-3" id="superparlet-1">
                  <div class="row g-2 align-items-center">

            <!-- REQUISITOS -->
            <div id="requisitosMsg" class="requisitos-msg mt-3">
              <i class="fas fa-info-circle"></i>
              <span id="requisitosTexto">Selecciona cliente, forma de pago y 2 sorteos para habilitar los parlets.</span>

    <!-- COLUMNA DERECHA: MOSAICO RESUMEN -->
    <div class="col-lg-4">
      <div class="sp-card card-resumen" style="position:sticky;top:1rem;">
        <div class="sp-card-header">

            <div class="celda"><span class="etiqueta">Saldo inicial (FP)</span><span class="valor" id="resumenSaldoInicial">$0.00</span></div>
            <div class="celda"><span class="etiqueta">Bonos activos</span><span class="valor warning" id="resumenBonos">$0.00</span></div>
            <div class="celda span-2"><span class="etiqueta">Saldo final (FP)</span><span class="valor danger" id="resumenSaldoFinal">$0.00</span></div>

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  'use strict';

  // ===== VARIABLES GLOBALES =====
  window.sorteosSeleccionados = [];
  window.usuarioId = parseInt('{{ user.id|default:"0" }}') || 0;
  window.esCliente = {{ es_cliente|yesno:"true,false" }};
  window.esSuperadmin = {{ es_superadmin|yesno:"true,false" }};
  window.destinatarioId = null;
  window.clienteSeleccionadoId = null;
  window.formaPagoSeleccionada = null;
  window.saldoFormaPagoSeleccionada = 0;
  window.bonosDisponibles = 0;
  window.postpagoDisponible = 0;
  window.totalApuestas = 0;
  let updateTimeout = null;

  const submitBtn = document.getElementById('submitBtn');
  const btnAgregarParlet = document.getElementById('btnAgregarParlet');
  const parletsHelper = document.getElementById('parletsHelper');

  // ===== TOASTS =====
  function mostrarToast(mensaje, tipo) {
    tipo = tipo || 'info';
    const container = document.getElementById('toastContainer');
    if (!container) { alert(mensaje); return; }
    const toastId = 'toast-' + Date.now();
    const bg = tipo === 'warning' ? 'warning' : tipo === 'danger' ? 'danger' : tipo === 'success' ? 'success' : 'primary';
    const icon = tipo === 'warning' ? 'exclamation-triangle' : tipo === 'danger' ? 'x-circle' : tipo === 'success' ? 'check-circle' : 'info-circle';
    const html = `<div id="${toastId}" class="toast align-items-center text-white bg-${bg} border-0" role="alert" style="margin-bottom:8px;background:rgba(10,14,26,0.9) !important;backdrop-filter:blur(8px);"><div class="d-flex"><div class="toast-body"><i class="fas fa-${icon} me-2"></i> ${mensaje}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>`;
    container.insertAdjacentHTML('beforeend', html);
    const el = document.getElementById(toastId);
    const toast = new bootstrap.Toast(el, { delay: 5000 });
    toast.show();
    el.addEventListener('hidden.bs.toast', () => el.remove());
  }

  // ===== VERIFICAR REQUISITOS =====
  function verificarRequisitos() {
    const clienteId = document.getElementById('clienteSeleccionado').value;
    const formaPago = window.formaPagoSeleccionada;
    const sorteos = window.sorteosSeleccionados || [];
    const tieneCliente = !!clienteId;
    const tieneFormaPago = !!formaPago;
    const tieneDosSorteos = (sorteos.length === 2);
    const requisitosOk = tieneCliente && tieneFormaPago && tieneDosSorteos;

    const inputsParlet = document.querySelectorAll('.superparlet-parlet');
    const inputsMonto = document.querySelectorAll('.superparlet-monto');
    const botonesEliminar = document.querySelectorAll('.superparlet-fila .btn-outline-danger');
    const btnAgregar = document.getElementById('btnAgregarParlet');

    inputsParlet.forEach(inp => inp.disabled = !requisitosOk);
    inputsMonto.forEach(inp => inp.disabled = !requisitosOk);
    botonesEliminar.forEach(btn => btn.disabled = !requisitosOk);
    if (btnAgregar) btnAgregar.disabled = !requisitosOk;

    if (parletsHelper) {
      parletsHelper.style.display = requisitosOk ? 'none' : 'block';
    }

    const requisitosMsg = document.getElementById('requisitosMsg');
    const requisitosTexto = document.getElementById('requisitosTexto');
    if (requisitosOk) {
      requisitosMsg.style.display = 'none';
    } else {
      requisitosMsg.style.display = 'block';
      let texto = 'Falta: ';
      const faltantes = [];
      if (!tieneCliente) faltantes.push('cliente');
      if (!tieneFormaPago) faltantes.push('forma de pago');
      if (!tieneDosSorteos) faltantes.push('2 sorteos');
      requisitosTexto.textContent = 'Selecciona ' + faltantes.join(', ') + ' para habilitar los parlets.';
    }

    const parletsValidos = validarParletsCargados();
    submitBtn.disabled = !(requisitosOk && parletsValidos);
  }

  function validarParletsCargados() {
    let tieneParlet = false;
    document.querySelectorAll('.superparlet-fila').forEach(fila => {
      const parlet = fila.querySelector('.superparlet-parlet')?.value.trim() || '';
      const monto = parseFloat(fila.querySelector('.superparlet-monto')?.value) || 0;
      if (parlet && monto > 0) tieneParlet = true;
    });
    return tieneParlet;
  }

  // ===== UI =====
  window.ajustarAnchoMonto = function(inp) {
    if (inp.disabled) return;
    const val = inp.value || inp.placeholder || '0';
    const tmp = document.createElement('span');
    tmp.style.visibility = 'hidden';
    tmp.style.position = 'absolute';
    tmp.style.whiteSpace = 'nowrap';
    tmp.style.fontSize = getComputedStyle(inp).fontSize;
    tmp.style.fontFamily = getComputedStyle(inp).fontFamily;
    tmp.style.fontWeight = getComputedStyle(inp).fontWeight;
    tmp.style.padding = getComputedStyle(inp).padding;
    tmp.textContent = val;
    document.body.appendChild(tmp);
    inp.style.width = Math.max(50, tmp.offsetWidth + 16) + 'px';
    document.body.removeChild(tmp);
  };

  window.formatearSuperparlet = function(inp) {
    if (inp.disabled) return;
    let raw = inp.value.replace(/[^0-9xX]/g, '').replace(/X/g, 'x');
    let digits = raw.replace(/x/g, '');
    let pairs = [];
    for (let i = 0; i < digits.length; i += 2) {
      pairs.push(digits.substring(i, i + 2));
    }
    let parlets = [];
    for (let i = 0; i < pairs.length; i += 2) {
      let p1 = pairs[i];
      let p2 = pairs[i+1] || '';
      if (p2) parlets.push(p1 + 'x' + p2);
      else parlets.push(p1);
    }
    inp.value = parlets.join(' ');
    inp.setSelectionRange(inp.value.length, inp.value.length);
    programarActualizacion();
  };

  window.calcularFila = function(inp) {
    if (inp.disabled) return;
    const fila = inp.closest('.superparlet-fila');
    if (!fila) return;
    const parletInput = fila.querySelector('.superparlet-parlet');
    const parletTexto = parletInput ? parletInput.value.trim() : '';
    const cantidadParlets = parletTexto ? parletTexto.split(/\s+/).filter(p => p.includes('x')).length : 0;
    const monto = parseFloat(fila.querySelector('.superparlet-monto')?.value) || 0;
    const totalFila = monto * (cantidadParlets || 1);
    const totalSpan = fila.querySelector('.total-fila');
    if (totalSpan) totalSpan.textContent = '$' + totalFila.toFixed(2);
    programarActualizacion();
  };

  function programarActualizacion() {
    if (updateTimeout) clearTimeout(updateTimeout);
    updateTimeout = setTimeout(() => {
      actualizarTodo();
      updateTimeout = null;
    }, 500);
  }

  function actualizarTodo() {
    calcularTotales();
    renderizarResumen();
    renderizarSorteos();
    guardarEstado();
    verificarRequisitos();
  }

  // ===== RECOLECTAR =====
  function recolectarItemsSuperparlet() {
    let items = [];
    document.querySelectorAll('.superparlet-fila').forEach(fila => {
      const parInput = fila.querySelector('.superparlet-parlet');
      const parTexto = parInput ? parInput.value.trim() : '';
      const cantidadParlets = parTexto ? parTexto.split(/\s+/).filter(p => p.includes('x')).length : 0;
      const m = parseFloat(fila.querySelector('.superparlet-monto')?.value) || 0;
      if (parTexto && m > 0 && cantidadParlets > 0) {
        items.push({ tipo: 'superparlet', numero: parTexto, monto: parseFloat((m * cantidadParlets).toFixed(2)) });
      }
    });
    return items;
  }

  function consolidarItems(items) {
    const acum = {};
    items.forEach(item => {
      if (!acum[item.tipo]) acum[item.tipo] = {};
      const montoRedondeado = parseFloat(item.monto.toFixed(2));
      if (!acum[item.tipo][item.numero]) acum[item.tipo][item.numero] = 0;
      acum[item.tipo][item.numero] += montoRedondeado;
    });
    return acum;
  }

  function renderAcum(acum) {
    let html = '';
    for (const tipo in acum) {
      const porMonto = {};
      for (const num in acum[tipo]) {
        const monto = parseFloat(acum[tipo][num].toFixed(2));
        if (!porMonto[monto]) porMonto[monto] = [];
        porMonto[monto].push(num);
      }
      for (const monto in porMonto) {
        const nums = porMonto[monto].sort().join(' ');
        html += `<div class="item-jugada">
          <span class="tipo">${tipo}</span>
          <span class="nums">${nums}</span>
          <span class="mto">$${parseFloat(monto).toFixed(2)}</span>
        </div>`;
      }
    }
    return html || '<span class="text-muted" style="color:#6b7280;">No hay parlets cargados</span>';
  }

  function generarDetalleHtml() {
    return renderAcum(consolidarItems(recolectarItemsSuperparlet()));
  }

  // ===== SORTEOS EN MOSAICO =====
  function renderizarSorteos() {
    const container = document.getElementById('detalleSorteos');
    const ids = window.sorteosSeleccionados || [];
    if (ids.length === 2) {
      const selectedCheckboxes = document.querySelectorAll('.sorteo-checkbox-modal:checked');
      let html = '';
      selectedCheckboxes.forEach((cb, index) => {
        const nombre = cb.dataset.nombre || 'Sorteo';
        const hora = cb.dataset.hora || '';
        html += `<div class="item-sorteo">
          <span class="tipo">Sorteo ${index+1}</span>
          <span class="nombre">${nombre}</span>
          <span class="hora">${hora}</span>
        </div>`;
      });
      container.innerHTML = html || '<span class="text-muted" style="font-size:0.7rem;">No hay sorteos seleccionados</span>';
    } else {
      container.innerHTML = '<span class="text-muted" style="font-size:0.7rem;">Ninguno seleccionado</span>';
    }
  }

  // ===== CALCULAR TOTALES =====
  function calcularTotales() {
    const items = recolectarItemsSuperparlet();
    const sumaTotal = items.reduce((sum, item) => sum + item.monto, 0);
    document.getElementById('superparletSuma').textContent = '$' + sumaTotal.toFixed(2);
    document.getElementById('resumenTotal').textContent = '$' + sumaTotal.toFixed(2);
    document.getElementById('footerTotal').textContent = '$' + sumaTotal.toFixed(2);

    const sp1 = window.sorteosSeleccionados[0] || null;
    const sp2 = window.sorteosSeleccionados[1] || null;
    const totalGeneral = (items.length && sp1 && sp2) ? sumaTotal : 0;
    window.totalApuestas = totalGeneral;

    const saldoFP = window.saldoFormaPagoSeleccionada || 0;
    const bonos = window.bonosDisponibles || 0;
    const postpago = window.postpagoDisponible || 0;

    const fromFP = Math.min(totalGeneral, saldoFP);
    const restoTrasFP = Math.max(0, totalGeneral - saldoFP);
    const fromBono = Math.min(restoTrasFP, bonos);
    const restoTrasBono = Math.max(0, restoTrasFP - bonos);
    const fromPostpago = Math.min(restoTrasBono, postpago);

    const saldoFinalFP = saldoFP - fromFP;
    const bonosRestantes = bonos - fromBono;
    const postpagoRestante = postpago - fromPostpago;

    document.getElementById('resumenSaldoInicial').textContent = '$' + saldoFP.toFixed(2);
    document.getElementById('resumenSaldoFinal').textContent = '$' + saldoFinalFP.toFixed(2);
    document.getElementById('footerSaldo').textContent = '$' + saldoFinalFP.toFixed(2);

    const elBonos = document.getElementById('resumenBonos');
    const elPostpago = document.getElementById('resumenPostpago');
    if (elBonos) elBonos.textContent = '$' + bonosRestantes.toFixed(2);
    if (elPostpago) elPostpago.textContent = '$' + postpagoRestante.toFixed(2);

    const footerBP = document.getElementById('footerBonoPostpago');
    if (footerBP) footerBP.textContent = '$' + (bonosRestantes + postpagoRestante).toFixed(2);

    const avisoEl = document.getElementById('avisoDescuentoExtra');
    const avisoTexto = document.getElementById('avisoDescuentoTexto');
    if (avisoEl && avisoTexto) {
      if (fromBono > 0 || fromPostpago > 0) {
        const partes = [];
        if (fromBono > 0) partes.push(`Bono: $${fromBono.toFixed(2)}`);
        if (fromPostpago > 0) partes.push(`Postpago: $${fromPostpago.toFixed(2)}`);
        avisoTexto.textContent = 'Se usará: ' + partes.join(' · ');
        avisoEl.style.display = 'flex';
      } else {
        avisoEl.style.display = 'none';
      }
    }
  }

  function renderizarResumen() {
    document.getElementById('detalleParlets').innerHTML = generarDetalleHtml();
    renderizarSorteos();
  }

  // ===== AGREGAR / ELIMINAR PARLETS =====
  window.agregarSuperparlet = function() {
    const container = document.getElementById('superparletLista');
    const filas = container.querySelectorAll('.superparlet-fila');
    const newId = 'superparlet-' + Date.now();
    const newRow = filas[0].cloneNode(true);
    newRow.id = newId;
    const inputs = newRow.querySelectorAll('input');
    inputs.forEach(inp => {
      inp.value = '';
      inp.disabled = !document.getElementById('clienteSeleccionado').value || !window.formaPagoSeleccionada || window.sorteosSeleccionados.length < 2;
    });
    const totalSpan = newRow.querySelector('.total-fila');
    if (totalSpan) { totalSpan.id = 'totalSuperparlet-' + newId; totalSpan.textContent = '$0.00'; }
    const btnEliminar = newRow.querySelector('.btn-outline-danger');
    if (btnEliminar) btnEliminar.disabled = !document.getElementById('clienteSeleccionado').value || !window.formaPagoSeleccionada || window.sorteosSeleccionados.length < 2;
    container.appendChild(newRow);
    programarActualizacion();
    verificarRequisitos();
  };

  window.eliminarSuperparlet = function(btn) {
    const fila = btn.closest('.superparlet-fila');
    const container = document.getElementById('superparletLista');
    if (container.querySelectorAll('.superparlet-fila').length <= 1) { mostrarToast('Debe haber al menos un parlet.', 'warning'); return; }
    fila.remove();
    programarActualizacion();
    verificarRequisitos();
  };

  // ===== CLIENTE =====
  const clienteSelect = document.getElementById('clienteSelect');
  clienteSelect.addEventListener('change', function() {
    const option = this.options[this.selectedIndex];
    if (!option || !option.value) { cancelarCliente(); return; }
    const el = { dataset: {
        id: option.value,
        nombre: option.dataset.nombre || option.text,
        saldo: option.dataset.saldo || '0',
        bonos: option.dataset.bonos || '0',
        telefono: option.dataset.telefono || '',
        rol: option.dataset.rol || ''
      }
    };
    seleccionarCliente(el);
  });

  window.seleccionarCliente = function(el) {
    const id = el.dataset.id;
    const nombre = el.dataset.nombre;
    const saldo = parseFloat(el.dataset.saldo) || 0;
    const bonos = parseFloat(el.dataset.bonos) || 0;

    document.getElementById('clienteSeleccionado').value = id;
    document.getElementById('clienteIdHidden').value = id;
    document.getElementById('clienteSeleccionadoNombre').textContent = nombre;
    document.getElementById('cancelarClienteBtn').style.display = 'inline-block';

    document.getElementById('resumenBonos').textContent = '$' + bonos.toFixed(2);

    let clienteNombre, gestorNombre, targetId;
    if (window.esCliente) {
        clienteNombre = '{{ user.username }}';
        gestorNombre = nombre;

        window.clienteSeleccionadoId = window.usuarioId;

        gestorNombre = '{{ user.username }}';

        window.clienteSeleccionadoId = id;

  document.getElementById('cancelarClienteBtn')?.addEventListener('click', cancelarCliente);

  // ===== FORMAS DE PAGO =====
  function cargarFormasPago(clienteId) {
    if (!clienteId) {
      document.getElementById('tablaFondosCliente').style.display = 'none';
      verificarRequisitos();
      return;
    }
    const container = document.getElementById('tablaFondosCliente');
    container.style.display = 'block';
    const tbody = document.getElementById('cuerpoTablaFondos');
    tbody.innerHTML = '<tr><td colspan="' + (window.esSuperadmin ? 5 : 4) + '" class="text-center text-muted">Cargando formas de pago...</td></tr>';

    Promise.all([
      fetch("{% url 'jugadas:api_forma_pago_cliente' %}?cliente_id=" + clienteId).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
      fetch("{% url 'jugadas:api_verificar_saldo' %}?usuario_id=" + clienteId).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    ])
    .then(([fpData, saldoData]) => {
      if (fpData.error) throw new Error(fpData.error);
      if (saldoData.error) throw new Error(saldoData.error);

      const saldos = saldoData.saldos || {};
      const totalBonos = saldoData.total_bonos || 0;
      const postpagoPendiente = saldoData.postpago_pendiente || 0;
      const formasPago = fpData.formas_pago || [];

      window.bonosDisponibles = totalBonos || 0;
      window.postpagoDisponible = postpagoPendiente || 0;

      if (formasPago.length === 0) {
        tbody.innerHTML = '<tr><td colspan="' + (window.esSuperadmin ? 5 : 4) + '" class="text-center text-muted">Este cliente no tiene formas de pago.</td></tr>';
        verificarRequisitos();
        return;
      }

      let html = '';
      let totalGeneral = 0;
      let primeraConSaldo = null;

      formasPago.forEach((fp) => {
        const saldo = saldos[fp.id] || 0;
        totalGeneral += saldo;
        const tieneSaldo = saldo > 0;
        if (tieneSaldo && primeraConSaldo === null) primeraConSaldo = fp.id;
        const checked = (tieneSaldo && primeraConSaldo === fp.id) ? 'checked' : '';
        const disabled = !tieneSaldo ? 'disabled' : '';
        html += `<tr>
          <td class="forma-pago-nombre" style="color:#000 !important;font-weight:700 !important;background:#f3f4f6 !important;">${fp.nombre}</td>
          <td style="color:#34d399;">$${saldo.toFixed(2)}</td>
          ${window.esSuperadmin ? '<td style="color:#9ca3af;">—</td>' : ''}
          <td class="total-col" style="color:#2563eb !important;font-weight:700 !important;">$${saldo.toFixed(2)}</td>
          <td>
            <input type="radio" name="forma_pago_radio" value="${fp.id}" ${checked} ${disabled} class="forma-pago-radio-input" data-nombre="${fp.nombre}" data-saldo="${saldo}">
          </td>
        </tr>`;
      });

      if (totalBonos > 0) {
        html += `<tr class="table-warning">
          <td style="color:#000 !important;font-weight:700 !important;background:#f3f4f6 !important;"><strong>Bonos totales</strong></td>
          <td>-</td>
          ${window.esSuperadmin ? '<td style="color:#fbbf24;"><strong>$' + totalBonos.toFixed(2) + '</strong></td>' : ''}
          <td style="color:#2563eb !important;font-weight:700 !important;">$${totalBonos.toFixed(2)}</td>
          <td></td>
        </tr>`;
        totalGeneral += totalBonos;
      }

      if (postpagoPendiente > 0) {
        html += `<tr class="table-info">
          <td style="color:#000 !important;font-weight:700 !important;background:#f3f4f6 !important;"><strong>Postpago</strong></td>
          <td>-</td>
          ${window.esSuperadmin ? '<td style="color:#60a5fa;">—</td>' : ''}
          <td style="color:#2563eb !important;font-weight:700 !important;">$${postpagoPendiente.toFixed(2)}</td>
          <td></td>
        </tr>`;
        totalGeneral += postpagoPendiente;
      }

      html += `<tr class="table-success fw-bold">
        <td style="color:#000 !important;font-weight:700 !important;background:#f3f4f6 !important;">TOTAL</td>
        <td></td>
        ${window.esSuperadmin ? '<td></td>' : ''}
        <td style="color:#2563eb !important;font-weight:700 !important;">$${totalGeneral.toFixed(2)}</td>
        <td></td>
      </tr>`;
      tbody.innerHTML = html;

      document.getElementById('resumenPostpago').textContent = '$' + postpagoPendiente.toFixed(2);
      document.getElementById('resumenBonos').textContent = '$' + totalBonos.toFixed(2);

      window.saldosFormaPago = {};
      formasPago.forEach(fp => {
        window.saldosFormaPago[fp.id] = saldos[fp.id] || 0;
      });

      const radios = document.querySelectorAll('input[name="forma_pago_radio"]');
      radios.forEach(input => {
        input.addEventListener('change', function() {
          if (this.checked) {
            const nombre = this.dataset.nombre || this.value;
            const saldo = parseFloat(this.dataset.saldo) || 0;
            document.getElementById('resumenFormaPago').textContent = nombre;
            window.formaPagoSeleccionada = this.value;
            window.saldoFormaPagoSeleccionada = saldo;
            document.getElementById('resumenSaldoInicial').textContent = '$' + saldo.toFixed(2);
            programarActualizacion();
            verificarRequisitos();
          }
        });
        if (input.checked) {
          input.dispatchEvent(new Event('change'));
        }
      });

      if (window.formaPagoSeleccionada) {
        const radioSeleccionado = document.querySelector(`input[name="forma_pago_radio"][value="${window.formaPagoSeleccionada}"]`);
        if (radioSeleccionado) {
          radioSeleccionado.checked = true;
          radioSeleccionado.dispatchEvent(new Event('change'));
        }
      } else {
        const primeroConSaldo = document.querySelector('input[name="forma_pago_radio"]:not([disabled])');
        if (primeroConSaldo) {
          primeroConSaldo.checked = true;
          primeroConSaldo.dispatchEvent(new Event('change'));
        }
      }

      programarActualizacion();
      verificarRequisitos();
    })
    .catch(err => {
      console.error('Error cargando formas de pago:', err);
      mostrarToast('Error cargando formas de pago: ' + err.message, 'danger');
      tbody.innerHTML = '<tr><td colspan="' + (window.esSuperadmin ? 5 : 4) + '" class="text-center text-danger">Error al cargar</td></tr>';
      verificarRequisitos();
    });
  }

  // ===== SORTEOS =====
  const btnAbrirSorteos = document.getElementById('btnAbrirSorteosSuperparlet');
  const modalSorteos = document.getElementById('modalSorteosManualSuperparlet');
  const closeSorteosBtn = document.getElementById('closeSorteosManualSuperparletBtn');
  const cancelSorteosBtn = document.getElementById('cancelSorteosSuperparletBtn');
  const guardarSorteosBtn = document.getElementById('guardarSorteosSuperparletBtn');
  const sorteoCount = document.getElementById('sorteosSeleccionadosCount');
  const sorteoList = document.getElementById('sorteosSeleccionadosList');
  const sorteosHidden = document.getElementById('sorteosHiddenInput');

  if (btnAbrirSorteos) {
    btnAbrirSorteos.addEventListener('click', function(e) {
      e.preventDefault();
      modalSorteos.classList.add('active');
      renderizarModalSorteos();
    });
  }

  function cerrarModalSorteos() { modalSorteos.classList.remove('active'); }
  if (closeSorteosBtn) closeSorteosBtn.addEventListener('click', cerrarModalSorteos);
  if (cancelSorteosBtn) cancelSorteosBtn.addEventListener('click', cerrarModalSorteos);
  modalSorteos.addEventListener('click', function(e) { if (e.target === this) cerrarModalSorteos(); });

  async function renderizarModalSorteos() {
    const container = document.getElementById('sorteosGridSuperparlet');
    const errorDiv = document.getElementById('sorteosErrorSuperparlet');
    container.innerHTML = '<div class="col-12 text-center py-4"><div class="spinner-border text-primary"></div><p class="text-muted mt-2">Cargando sorteos...</p></div>';
    if (errorDiv) errorDiv.style.display = 'none';

    try {
      const fecha = document.getElementById('fechaApuesta')?.value || new Date().toISOString().slice(0,10);
      const response = await fetch("{% url 'jugadas:api_sorteos_disponibles' %}?fecha=" + fecha);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const sorteos = await response.json();

      if (!sorteos || !sorteos.length) {
        container.innerHTML = '<div class="col-12 text-center py-4"><i class="fas fa-calendar-times fa-3x text-muted"></i><p class="text-muted">No hay sorteos disponibles.</p></div>';
        return;
      }

      // FIX_SUPERPARSER_GESTORES_V1: bancos/superadmin ven cerrados y salidos (ventana 24h del backend)
      const esGestor = window.esBanco || window.esSuperadmin;
      const disponibles = esGestor
        ? sorteos.filter(s => s.estado !== 'no_programado')
        : sorteos.filter(s => s.esta_abierto === true && s.minutos_restantes > 0);
      if (disponibles.length === 0) {
        container.innerHTML = '<div class="col-12 text-center py-4"><i class="fas fa-info-circle fa-3x text-muted"></i><p class="text-muted">No hay sorteos disponibles en este momento.</p></div>';
        return;
      }

      let html = '';
      disponibles.forEach(s => {
        const checked = window.sorteosSeleccionados && window.sorteosSeleccionados.includes(s.id) ? 'checked' : '';
        let badge = '';
        if (s.esta_abierto) {
          badge = `<span class="badge-minutos"><i class="fas fa-clock"></i> ${s.minutos_restantes || 0} min</span>`;
        } else if (s.estado === 'cerrado') {
          badge = `<span class="badge-minutos" style="background:#fee2e2 !important;color:#991b1b !important;border-color:#fca5a5 !important;"><i class="fas fa-lock"></i> Cerrado</span>`;
        } else if (s.estado === 'salido') {
          badge = `<span class="badge-minutos" style="background:#fef3c7 !important;color:#92400e !important;border-color:#fcd34d !important;"><i class="fas fa-flag-checkered"></i> Salido</span>`;
        }
        const cierre = s.hora_cierre ? ` <i class="fas fa-lock"></i> cierre: ${s.hora_cierre}` : '';
        html += `
          <div class="col-6 col-md-4">
            <label class="sorteo-check w-100">
              <input type="checkbox" class="form-check-input sorteo-checkbox-modal" value="${s.id}" ${checked} data-nombre="${s.nombre}" data-hora="${s.hora_salida || ''}">
              <div class="info-text">
                <strong>${s.nombre}</strong>
                <small><i class="fas fa-calendar-alt"></i> ${s.hora_salida || 'Sin hora'}${cierre}</small>
                ${badge}
              </div>
            </label>
          </div>
        `;
      });
      container.innerHTML = html;

      if (window.sorteosSeleccionados) {
        window.sorteosSeleccionados.forEach(id => {
          const cb = document.querySelector(`.sorteo-checkbox-modal[value="${id}"]`);
          if (cb) cb.checked = true;
        });
      }

      const finalCount = document.querySelectorAll('.sorteo-checkbox-modal:checked').length;
      document.getElementById('sorteosSeleccionadosCount').textContent = finalCount + ' seleccionado(s)';
    } catch (error) {
      container.innerHTML = '<div class="col-12 text-center py-4 text-danger"><i class="fas fa-exclamation-triangle fa-3x"></i><p>Error al cargar sorteos.</p></div>';
      if (errorDiv) { errorDiv.textContent = 'Error: ' + error.message; errorDiv.style.display = 'block'; }
    }
  }

  if (guardarSorteosBtn) {
    guardarSorteosBtn.addEventListener('click', function() {
      const selected = document.querySelectorAll('.sorteo-checkbox-modal:checked');
      const ids = Array.from(selected).map(cb => parseInt(cb.value));
      if (ids.length !== 2) {
        mostrarToast('Debes seleccionar exactamente 2 sorteos.', 'warning');
        return;
      }
      window.sorteosSeleccionados = ids;
      sorteosHidden.value = JSON.stringify(ids);
      sorteoCount.textContent = ids.length + ' seleccionado(s)';
      const nombres = Array.from(selected).map(cb => cb.dataset.nombre + ' (' + cb.dataset.hora + ')');
      sorteoList.textContent = nombres.join(' | ');
      programarActualizacion();
      cerrarModalSorteos();
      verificarRequisitos();
    });
  }

  document.getElementById('fechaApuesta').addEventListener('change', function() {
    const fecha = this.value;
    if (fecha) {
      document.getElementById('resumenFecha').textContent = fecha;
      if (modalSorteos.classList.contains('active')) renderizarModalSorteos();
      programarActualizacion();
    }
  });

  // ===== LIMPIAR TODO =====
  window.limpiarTodo = function() {
    document.querySelectorAll('.superparlet-fila input').forEach(inp => inp.value = '');
    cancelarCliente();
    window.sorteosSeleccionados = [];
    sorteosHidden.value = '';
    sorteoCount.textContent = '0 seleccionados';
    sorteoList.textContent = 'Ningún sorteo seleccionado';
    window.formaPagoSeleccionada = null;
    window.saldoFormaPagoSeleccionada = 0;
    window.bonosDisponibles = 0;
    window.postpagoDisponible = 0;
    programarActualizacion();
    localStorage.removeItem('superparlet_data_' + window.usuarioId);
    verificarRequisitos();
  };

  // ===== GUARDAR APUESTA =====
  document.getElementById('submitBtn').addEventListener('click', function(e) {
    e.preventDefault();
    const clienteId = document.getElementById('clienteSeleccionado').value;
    const formaPago = window.formaPagoSeleccionada;
    const sp1 = window.sorteosSeleccionados[0] || null;
    const sp2 = window.sorteosSeleccionados[1] || null;
    if (!clienteId) { mostrarToast('Selecciona un cliente.', 'warning'); return; }
    if (!formaPago) { mostrarToast('Selecciona una forma de pago.', 'warning'); return; }
    if (!sp1 || !sp2) { mostrarToast('Selecciona dos sorteos diferentes.', 'warning'); return; }
    if (sp1 === sp2) { mostrarToast('Los sorteos deben ser diferentes.', 'warning'); return; }

    const totalApuestas = window.totalApuestas || 0;
    const fp = window.saldoFormaPagoSeleccionada || 0;
    const bonos = window.bonosDisponibles || 0;
    const postpago = window.postpagoDisponible || 0;
    const saldoTotal = fp + bonos + postpago;

    if (totalApuestas > saldoTotal) {
      mostrarToast(
        `Saldo insuficiente. FP: $${fp.toFixed(2)} + Bonos: $${bonos.toFixed(2)} + Postpago: $${postpago.toFixed(2)} = $${saldoTotal.toFixed(2)}. Necesario: $${totalApuestas.toFixed(2)}`,
        'warning'
      );
      return;
    }

    const modalPass = new bootstrap.Modal(document.getElementById('modalVerificarPassword'));
    document.getElementById('passwordError').style.display = 'none';
    document.getElementById('passwordConfirmInput').value = '';
    modalPass.show();
  });

  document.getElementById('confirmarPasswordBtn').addEventListener('click', function() {
    const pwd = document.getElementById('passwordConfirmInput').value;
    if (!pwd) { document.getElementById('passwordError').textContent = 'Ingresa tu contraseña.'; document.getElementById('passwordError').style.display = 'block'; return; }
    fetch("{% url 'jugadas:api_verificar_password' %}", {
      method: 'POST',
      headers: { 'X-CSRFToken': getCookie('csrftoken'), 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        bootstrap.Modal.getInstance(document.getElementById('modalVerificarPassword')).hide();
        enviarCarrito();
      } else {
        document.getElementById('passwordError').textContent = 'Contraseña incorrecta.';
        document.getElementById('passwordError').style.display = 'block';
        document.getElementById('passwordConfirmInput').value = '';
        document.getElementById('passwordConfirmInput').focus();
      }
    })
    .catch(() => {
      document.getElementById('passwordError').textContent = 'Error de conexión.';
      document.getElementById('passwordError').style.display = 'block';
    });
  });

  function enviarCarrito() {
    const clienteId = document.getElementById('clienteSeleccionado').value;
    const formaPago = window.formaPagoSeleccionada;
    const items = recolectarItemsSuperparlet();
    const sp1 = window.sorteosSeleccionados[0] || null;
    const sp2 = window.sorteosSeleccionados[1] || null;
    const fecha = document.getElementById('fechaApuesta').value;

    const formData = new FormData();
    formData.append('superparlet_data', JSON.stringify(items));
    formData.append('superparlet_sorteos', JSON.stringify([sp1, sp2]));
    formData.append('fecha', fecha);
    formData.append('cliente_id', clienteId);
    formData.append('forma_pago', formaPago);
    formData.append('csrfmiddlewaretoken', document.querySelector('[name="csrfmiddlewaretoken"]').value);
    if (window.destinatarioId) formData.append('destinatario_id', window.destinatarioId);

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Guardando...';

    fetch("{% url 'jugadas:guardar_apuesta' %}", {
      method: 'POST',
      body: formData,
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        mostrarToast(data.message, 'success');
        const clienteActual = document.getElementById('clienteSeleccionado').value;
        limpiarTodo();
        if (clienteActual) {
          setTimeout(() => {
            cargarFormasPago(clienteActual);
          }, 300);
        }
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check-circle"></i> Confirmar Superparlet';
        setTimeout(() => window.location.reload(), 800);
      } else {
        mostrarToast(data.message || 'Error al guardar.', 'danger');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check-circle"></i> Confirmar Superparlet';
      }
    })
    .catch(error => {
      mostrarToast('Error: ' + error.message, 'danger');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-check-circle"></i> Confirmar Superparlet';
    });
  }

  function getCookie(name) {
    let value = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          value = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return value;
  }

  // ===== LOCALSTORAGE =====
  function guardarEstado() {
    try {
      const estado = {
        clienteId: document.getElementById('clienteSeleccionado').value,
        clienteNombre: document.getElementById('clienteSeleccionadoNombre').textContent,
        formaPago: window.formaPagoSeleccionada || '',
        fecha: document.getElementById('fechaApuesta')?.value || '',
        sorteos: window.sorteosSeleccionados || [],
        parlets: []
      };
      document.querySelectorAll('.superparlet-fila').forEach(fila => {
        const parlet = fila.querySelector('.superparlet-parlet')?.value || '';
        const monto = fila.querySelector('.superparlet-monto')?.value || '';
        estado.parlets.push({ parlet, monto });
      });
      localStorage.setItem('superparlet_data_' + window.usuarioId, JSON.stringify(estado));
    } catch(e) {}
  }

  function restaurarEstado() {
    const data = localStorage.getItem('superparlet_data_' + window.usuarioId);
    if (!data) return;
    try {
      const estado = JSON.parse(data);

      if (estado.clienteId) {
        const select = document.getElementById('clienteSelect');
        const option = select?.querySelector(`option[value="${estado.clienteId}"]`);
        if (option) {
          select.value = estado.clienteId;
          select.dispatchEvent(new Event('change'));
        }
      }

      if (estado.fecha) {
        document.getElementById('fechaApuesta').value = estado.fecha;
      }

      if (estado.sorteos && estado.sorteos.length === 2) {
        window.sorteosSeleccionados = estado.sorteos;
        sorteosHidden.value = JSON.stringify(estado.sorteos);
        sorteoCount.textContent = estado.sorteos.length + ' seleccionado(s)';
      }

      if (estado.parlets && estado.parlets.length) {
        const container = document.getElementById('superparletLista');

        const baseRowOriginal = container.querySelector('.superparlet-fila');
        if (!baseRowOriginal) {
          console.warn('No se encontró la fila base para restaurar parlets.');
          return;
        }
        const plantilla = baseRowOriginal.cloneNode(true);

        container.innerHTML = '';
        estado.parlets.forEach((p, idx) => {
          const newId = 'superparlet-' + (idx + 1);
          const newRow = plantilla.cloneNode(true);
          newRow.id = newId;

          const parletInput = newRow.querySelector('.superparlet-parlet');
          const montoInput = newRow.querySelector('.superparlet-monto');
          const totalSpan = newRow.querySelector('.total-fila');

          if (parletInput) parletInput.value = p.parlet || '';
          if (montoInput) montoInput.value = p.monto || '';
          if (totalSpan) totalSpan.id = 'totalSuperparlet-' + newId;

          container.appendChild(newRow);
        });

        document.querySelectorAll('.superparlet-fila input').forEach(inp => {
          if (typeof calcularFila === 'function') calcularFila(inp);
        });
        setTimeout(programarActualizacion, 300);
      }

      if (estado.formaPago) {
        window.formaPagoSeleccionada = estado.formaPago;
      }

      setTimeout(() => {
        programarActualizacion();
        verificarRequisitos();
      }, 500);

    } catch (e) {
      console.error('Error restaurando estado:', e);
    }
  }

  // ===== INICIALIZACIÓN =====
  restaurarEstado();
  const fechaInput = document.getElementById('fechaApuesta');
  if (fechaInput) document.getElementById('resumenFecha').textContent = fechaInput.value;
  verificarRequisitos();
  console.log('🚀 Superparlet cargado – cascada FP → Bono → Postpago activa.');
});
</script>
{% endblock extra_js %}
