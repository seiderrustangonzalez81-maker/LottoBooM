<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados LottoBooM</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 15px; margin: 0; }
        h1 { text-align: center; color: #333; font-size: 24px; }
        .card { background: white; padding: 15px; margin-bottom: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #0056b3; }
        h3 { margin: 0 0 5px 0; color: #333; font-size: 18px; }
        .fecha { color: #777; font-size: 12px; margin-bottom: 10px; display: block;}
        .numeros { font-size: 22px; font-weight: bold; color: #0056b3; background: #eef4fb; padding: 8px; border-radius: 4px; text-align: center; letter-spacing: 2px;}
    </style>
</head>
<body>
    <h1>Últimos Resultados</h1>
    {% for r in resultados %}
        <div class="card">
            <h3>{{ r.sorteo.nombre }}</h3>
            <span class="fecha">{{ r.fecha }} - {{ r.hora }}</span>
            <div class="numeros">{{ r.numero_ganador }}</div>
        </div>
    {% empty %}
        <div class="card" style="text-align: center; color: #777;">
            <p>Aún no hay resultados guardados.</p>
        </div>
    {% endfor %}
</body>
</html>
