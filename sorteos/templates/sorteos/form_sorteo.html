{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container" style="max-width:600px; margin:auto; padding:20px;">
    <div style="background:#ffffff; border-radius:24px; padding:32px; box-shadow:0 2px 12px rgba(0,0,0,0.04); border:1px solid #eef2f6;">
        <h1 style="font-size:1.8rem; font-weight:700; color:#1a1a2e; margin-bottom:24px;">{{ titulo }}</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div style="display:flex; gap:12px; margin-top:20px;">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{% url 'sorteos:lista_sorteos' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<style>
    .btn {
        display: inline-block;
        padding: 10px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
    }
    .btn-primary {
        background: #6C3CE1;
        color: #ffffff;
    }
    .btn-primary:hover {
        background: #5a2fc9;
    }
    .btn-secondary {
        background: #eef2f6;
        color: #1a1a2e;
    }
    .btn-secondary:hover {
        background: #e2e8f0;
    }
</style>
{% endblock %}
