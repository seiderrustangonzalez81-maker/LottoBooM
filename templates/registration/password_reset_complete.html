{% extends "base.html" %}
{% load static %}

{% block page_title %}Contraseña Actualizada | LottoBooM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="background:#ffffff;">
            <div class="card-header text-white text-center border-0 py-4"
                 style="background:linear-gradient(135deg,#28a745 0%,#20c997 100%);">
                <h4 class="mb-0 fw-bold">🎉 ¡Listo!</h4>
            </div>
            <div class="card-body p-5 text-center">
                <div class="mb-4" style="font-size:3rem;">✅</div>
                <h5 class="mb-3">Tu contraseña se actualizó correctamente</h5>
                <p class="text-muted small mb-4">
                    Ya puedes iniciar sesión con tu nueva contraseña.
                </p>
                <a href="{% url 'usuarios:login' %}" class="btn btn-primary rounded-3 fw-bold">
                    <i class="fas fa-sign-in-alt"></i> Iniciar sesión
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
